[project]
name = "fieldbook"
version = "0.1.0"
description = "Fieldbook — backend engineering bootcamp reference project (Weeks 1–2 end state)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# errors, pyflakes, import-sorting, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "-q --cov=fieldbook --cov-report=term-missing"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldbook"]
